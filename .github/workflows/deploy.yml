
name: SecureAgent AI - Production Images

on:
  workflow_run:
    workflows:
      - "SecureAgent AI - Continuous Integration"
    types:
      - completed
    branches:
      - prod

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: secureagent-production-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Production Docker Images
    runs-on: ubuntu-latest

    # Only publish after successful CI on prod.
    # Manual runs must also target prod.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'prod' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/prod')

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set image metadata
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repository }}-api:prod
            ghcr.io/${{ steps.meta.outputs.repository }}-api:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish Next.js image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repository }}-web:prod
            ghcr.io/${{ steps.meta.outputs.repository }}-web:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
