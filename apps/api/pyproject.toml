[project]
name = "secureagent-api"
version = "0.1.0"
description = "SecureAgent AI API"
requires-python = ">=3.12"
# Dependencies are maintained exclusively in ../../requirements.txt.

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]

[tool.ruff]
line-length = 100
